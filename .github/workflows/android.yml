name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.2 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint every module
        run: ./gradlew build --stacktrace
      - name: Release sample through R8 (validates consumer rules)
        run: ./gradlew :sample:assembleRelease
      - name: Publish to Maven local (what JitPack runs)
        run: ./gradlew publishToMavenLocal
