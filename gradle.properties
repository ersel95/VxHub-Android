org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true

# Published coordinates: <vxhub.group>:<module>:<version>. JitPack (and CI) pass the git tag through
# `-Pversion`, which wins over vxhub.version, so a release needs no file edits.
vxhub.group=com.github.ersel95.VxHub-Android
vxhub.version=0.1.0
