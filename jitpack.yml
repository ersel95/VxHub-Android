# JitPack builds the artifacts straight from a git tag: tag, push, done. The tag reaches the build
# as -Pversion, which wins over vxhub.version (see build-logic/convention/.../VxPublishPlugin.kt).
jdk:
  - openjdk21

before_install:
  - sdk install java 21.0.5-tem || true
  - sdk use java 21.0.5-tem || true
  - yes | sdkmanager "platforms;android-37.2" "build-tools;37.0.0" || true

install:
  - ./gradlew --no-daemon publishToMavenLocal -x lint
