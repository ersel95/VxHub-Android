# Latest stable releases as of 2026-11. VxHub targets new projects, so the toolchain is current
# rather than held back; see AGENTS.md "Toolchain" before lowering anything here.
[versions]
agp = "9.5.1"
kotlin = "2.4.21"

compileSdk = "37"
compileSdkMinor = "2"
minSdk = "24"
targetSdk = "36"

coroutines = "1.11.0"
serialization = "1.12.0"
okhttp = "5.5.1"

androidx-core = "1.19.1"
androidx-annotation = "1.11.0"
androidx-lifecycle = "2.11.0"
androidx-activity = "1.13.0"
androidx-datastore = "1.3.0"
androidx-startup = "1.2.0"
androidx-browser = "1.10.0"
androidx-credentials = "1.6.0"
googleid = "1.2.1"
play-review = "2.0.2"
play-app-update = "2.1.0"
compose-bom = "2026.09.00"

revenuecat = "11.2.0"
firebase-bom = "35.1.0"
amplitude-analytics = "1.37.0"
amplitude-experiment = "1.19.0"
appsflyer = "7.0.4"
onesignal = "5.11.0"
sentry = "8.63.0"
facebook = "19.0.1"
coil = "3.6.3"
lottie = "6.7.1"
media3 = "1.11.1"

junit = "4.13.2"
robolectric = "4.17"
turbine = "1.2.1"
truth = "1.4.5"
androidx-test-core = "1.7.0"
androidx-test-junit = "1.3.0"

[libraries]
# Build logic
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

# Kotlin
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# Networking
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "androidx-startup" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
play-review = { module = "com.google.android.play:review-ktx", version.ref = "play-review" }
play-app-update = { module = "com.google.android.play:app-update-ktx", version.ref = "play-app-update" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# Third-party services (one satellite module each)
revenuecat = { module = "com.revenuecat.purchases:purchases", version.ref = "revenuecat" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
amplitude-analytics = { module = "com.amplitude:analytics-android", version.ref = "amplitude-analytics" }
amplitude-experiment = { module = "com.amplitude:experiment-android-client", version.ref = "amplitude-experiment" }
appsflyer = { module = "com.appsflyer:af-android-sdk", version.ref = "appsflyer" }
onesignal = { module = "com.onesignal:OneSignal", version.ref = "onesignal" }
sentry-android = { module = "io.sentry:sentry-android", version.ref = "sentry" }
facebook-core = { module = "com.facebook.android:facebook-core", version.ref = "facebook" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui-compose = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }

# Tests
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Convention plugins (build-logic)
vxhub-library = { id = "vxhub.android.library" }
vxhub-compose = { id = "vxhub.android.compose" }
vxhub-publish = { id = "vxhub.publish" }
